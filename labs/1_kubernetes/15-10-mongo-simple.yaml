apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: "mongo"
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongodb
        image: docker.io/library/mongo:7.0.43
        command:
        - mongod
        - --replSet
        - rs0
        - --bind_ip_all
        ports:
        - containerPort: 27017
          name: peer
        # Writable for any UID: the image /data/db belongs to the mongodb user,
        # and OpenShift runs the container with a random UID
        volumeMounts:
        - name: database
          mountPath: /data/db
      volumes:
      - name: database
        emptyDir: {}
