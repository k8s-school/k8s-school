apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
data:
  init.sh: |
    #!/bin/bash

    set -euxo pipefail

    # Need to wait for the headless service to publish this pod
    # so that the mongo names resolve
    until getent hosts ${HOSTNAME}.mongo; do
      echo "waiting for DNS (${HOSTNAME}.mongo)..."
      sleep 2
    done

    until mongosh --quiet --eval 'db.adminCommand("ping")'; do
      echo "connecting to local mongo..."
      sleep 2
    done
    echo "connected to local."

    if [[ "${HOSTNAME}" == 'mongo-0' ]]; then
      # rs.status() fails if the replica set is not initialized yet:
      # this keeps the script idempotent when the pod restarts
      echo "initializing replica set"
      mongosh --quiet --eval '
        try { rs.status() } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo-0.mongo:27017"}]})
        }'
    else
      # Connect to the replica set, not to mongo-0: after a rolling update,
      # the primary can be any member
      RS="mongodb://mongo-0.mongo:27017/?replicaSet=rs0"
      until mongosh --quiet "${RS}" --eval 'db.hello().isWritablePrimary' | grep true; do
        echo "waiting for the replica set primary..."
        sleep 2
      done
      echo "adding self to the replica set"
      mongosh --quiet "${RS}" --eval "
        if (!rs.conf().members.some(m => m.host == '${HOSTNAME}.mongo:27017')) {
          rs.add('${HOSTNAME}.mongo:27017')
        }"
    fi
    echo "initialized"

    while true; do
      sleep 3600
    done
